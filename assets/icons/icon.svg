<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo degradado híbrido: Océano a Esmeralda -->
  <defs>
    <linearGradient id="ocean-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" /> <!-- Azul Océano -->
      <stop offset="100%" stop-color="#10b981" /> <!-- Verde Esmeralda -->
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#ocean-emerald)" />
  
  <!-- Sol resplandeciente -->
  <circle cx="200" cy="200" r="80" fill="#fbbf24" />
  <path d="M200 80 L200 40 M200 320 L200 360 M80 200 L40 200 M320 200 L360 200 M115 115 L85 85 M285 285 L315 315 M115 285 L85 315 M285 115 L315 85" stroke="#fbbf24" stroke-width="24" stroke-linecap="round" />
  
  <!-- Nube blanca moderna con sombra profunda -->
  <path d="M160 360 L350 360 A60 60 0 0 0 370 243 A80 80 0 0 0 220 230 A60 60 0 0 0 160 360 Z" fill="#ffffff" filter="drop-shadow(0px 10px 15px rgba(0,0,0,0.35))" />
</svg>
